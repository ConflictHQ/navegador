name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    # No Windows target: falkordblite (a hard dependency) publishes no Windows
    # wheel and its sdist refuses to build on win32, so `pip install -e .` cannot
    # succeed there. Windows users run navegador under WSL2. See issue #151.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Explicit bash so a failing `pip install` aborts the step. Without it a
        # non-bash default shell lets an intermediate failure pass silently and
        # PyInstaller happily builds a binary with nothing bundled in it.
        shell: bash
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        shell: bash
        run: |
          pyinstaller \
            --name navegador-${{ matrix.target }} \
            --onefile \
            --console \
            --hidden-import=navegador \
            --hidden-import=navegador.cli.commands \
            --hidden-import=navegador.ingestion \
            --hidden-import=navegador.ingestion.python \
            --hidden-import=navegador.ingestion.typescript \
            --hidden-import=navegador.ingestion.go \
            --hidden-import=navegador.ingestion.rust \
            --hidden-import=navegador.ingestion.java \
            --hidden-import=navegador.ingestion.knowledge \
            --hidden-import=navegador.ingestion.planopticon \
            --hidden-import=navegador.ingestion.wiki \
            --hidden-import=navegador.graph \
            --hidden-import=navegador.graph.store \
            --hidden-import=navegador.graph.schema \
            --hidden-import=navegador.graph.queries \
            --hidden-import=navegador.mcp \
            --hidden-import=navegador.mcp.server \
            --collect-all navegador \
            navegador/cli/commands.py

      - name: Smoke-test binary
        # Never upload an artifact nobody has run. Assert on output, not just
        # exit status: a binary that defines the command group and falls off the
        # end without invoking it also exits 0, so an exit-code-only check
        # passes a completely inert binary.
        shell: bash
        run: |
          BIN=./dist/navegador-${{ matrix.target }}
          "$BIN" --help | grep -q "Usage:" \
            || { echo "::error::--help produced no usage output"; exit 1; }
          "$BIN" ingest --help | grep -q "ingest" \
            || { echo "::error::subcommands are not registered"; exit 1; }
          "$BIN" --version | grep -q "version" \
            || { echo "::error::--version is empty; package metadata not bundled"; exit 1; }
          if "$BIN" --definitely-not-a-flag >/dev/null 2>&1; then
            echo "::error::binary accepts unknown flags; CLI is not dispatching"
            exit 1
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/navegador-${{ matrix.target }}
